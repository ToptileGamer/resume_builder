<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Resume Builder</title>
  <style>body { visibility: hidden; }</style>
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">

  <div class="login-card">

    <div class="login-logo">
      <div class="login-logo__icon">📝</div>
      <h1>Resume Builder</h1>
      <p>Sign in to build your professional resume</p>
    </div>

    <div id="alert-error" class="alert alert-error"></div>
    <div id="alert-success" class="alert alert-success"></div>

    <div class="tab-nav">
      <button class="tab-btn active" data-tab="login">Sign In</button>
      <button class="tab-btn" data-tab="signup">Sign Up</button>
    </div>

    <!-- Login Tab -->
    <div id="tab-login" class="tab-content" style="display:block">
      <form id="login-form" novalidate>
        <div class="form-group">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" placeholder="you@example.com" required>
        </div>
        <div class="form-group">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" placeholder="••••••••" required>
        </div>
        <button type="submit" class="login-btn" id="login-btn">Sign In</button>
      </form>
      <div class="login-footer">
        <a href="#" id="forgot-link">Forgot your password?</a>
      </div>
    </div>

    <!-- Signup Tab -->
    <div id="tab-signup" class="tab-content">
      <form id="signup-form" novalidate>
        <div class="form-group">
          <label for="signup-name">Full Name</label>
          <input type="text" id="signup-name" placeholder="Jane Doe" required>
        </div>
        <div class="form-group">
          <label for="signup-email">Email</label>
          <input type="email" id="signup-email" placeholder="you@example.com" required>
        </div>
        <div class="form-group">
          <label for="signup-password">Password</label>
          <input type="password" id="signup-password" placeholder="Minimum 8 characters" required minlength="8">
        </div>
        <button type="submit" class="login-btn" id="signup-btn">Create Account</button>
      </form>
    </div>

    <!-- Recovery Tab -->
    <div id="tab-recovery" class="tab-content">
      <p class="recovery-hint">Enter your email and we'll send you a link to reset your password.</p>
      <form id="recovery-form" novalidate>
        <div class="form-group">
          <label for="recovery-email">Email</label>
          <input type="email" id="recovery-email" placeholder="you@example.com" required>
        </div>
        <button type="submit" class="login-btn" id="recovery-btn">Send Reset Link</button>
      </form>
      <div class="login-footer">
        <a href="#" id="back-to-login">← Back to sign in</a>
      </div>
    </div>

  </div>

  <script src="login.bundle.js"></script>
</body>
</html>
