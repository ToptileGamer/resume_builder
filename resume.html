<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Your Resume</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="resume" id="resume">

  <!-- HEADER -->
  <div class="top">
    <h1 id="r-name"></h1>

    <div class="top-info">
      <div>
        <p>📞 <span id="r-phone"></span></p>
        <p>✉️ <span id="r-email"></span></p>
        <p>📍 <span id="r-address"></span></p>
      </div>

      
    </div>
  </div>

  <!-- BODY -->
  <div class="main">

    <!-- LEFT -->
    <div class="sidebar">

      <div>
        <h3>Personal details</h3>
        <p><b>Father:</b> <span id="r-father"></span></p>
        <p><b>Mother:</b> <span id="r-mother"></span></p>
      </div>
      <h3>Education</h3>
      <p id="r-education"></p>

      <h3>Languages</h3>
      <p id="r-languages"></p>

      <h3>Hobbies</h3>
      <p id="r-hobbies"></p>
    </div>

    <!-- RIGHT -->
    <div class="content">

      <h3>Career Objective</h3>
      <p id="r-profile"></p>

      <h3>Work Experience</h3>
      <p id="r-experience"></p>

      <h3>Skills</h3>
      <ul id="r-skills"></ul>

      <h3>Technical Skills</h3>
      <p id="r-tech"></p>

      <h3>Projects</h3>
      <p id="r-projects"></p>

      <h3>Declaration</h3>
      <p>I hereby declare that the information is true and correct.</p>

    </div>

  </div>

</div>

<div class="actions">
  <button onclick="downloadPDF()">Download PDF</button>
  <button onclick="goBack()">Edit Resume</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>
const data = JSON.parse(localStorage.getItem("resumeData"));

// Fill data
Object.keys(data).forEach(key => {
  if (document.getElementById("r-" + key)) {
    document.getElementById("r-" + key).innerText = data[key];
  }
});

// Skills list
let skills = (data.skills || "").split(",");
let ul = document.getElementById("r-skills");

skills.forEach(skill => {
  if (skill.trim() !== "") {
    let li = document.createElement("li");
    li.innerText = skill.trim();
    ul.appendChild(li);
  }
});

// PDF
async function downloadPDF() {
  const { jsPDF } = window.jspdf;

  const canvas = await html2canvas(document.getElementById("resume"), { scale: 2 });
  const imgData = canvas.toDataURL("image/png");

  const pdf = new jsPDF("p", "mm", "a4");
  const width = pdf.internal.pageSize.getWidth();
  const height = (canvas.height * width) / canvas.width;

  pdf.addImage(imgData, "PNG", 0, 0, width, height);
  pdf.save("resume.pdf");
}

// Back
function goBack() {
  window.location.href = "index.html";
}
</script>

</body>
</html>
