<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Resume Builder - Dashboard</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body class="dashboard-page">
  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="nav-container">
      <div class="nav-brand">
        <h1>Resume Builder</h1>
      </div>
      <div class="nav-menu">
        <span class="user-email" id="userEmail"></span>
        <button class="btn btn-secondary" onclick="logout()">Logout</button>
      </div>
    </div>
  </nav>

  <!-- MAIN CONTENT -->
  <div class="dashboard-container">
    <!-- LEFT PANEL - FORM -->
    <div class="form-panel">
      <div class="form-content">
        <h2>Build Your Resume</h2>

        <!-- PERSONAL INFO SECTION -->
        <div class="form-section">
          <h3>Personal Information</h3>
          <div class="form-group">
            <label for="name">Full Name</label>
            <input id="name" type="text" placeholder="Full Name" />
          </div>
          <div class="form-group">
            <label for="title">Professional Title</label>
            <input id="title" type="text" placeholder="e.g., Software Engineer" />
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="phone">Phone</label>
              <input id="phone" type="tel" placeholder="Phone" />
            </div>
            <div class="form-group">
              <label for="email">Email</label>
              <input id="email" type="email" placeholder="Email" />
            </div>
          </div>
          <div class="form-group">
            <label for="address">Address</label>
            <input id="address" type="text" placeholder="Address" />
          </div>
        </div>

        <!-- PROFESSIONAL SECTION -->
        <div class="form-section">
          <h3>Professional Information</h3>
          <div class="form-group">
            <label for="profile">Career Objective</label>
            <textarea id="profile" placeholder="Career Objective"></textarea>
          </div>
          <div class="form-group">
            <label for="experience">Work Experience</label>
            <textarea id="experience" placeholder="Work Experience"></textarea>
          </div>
          <div class="form-group">
            <label for="skills">Skills (comma separated)</label>
            <textarea id="skills" placeholder="e.g., JavaScript, Python, React"></textarea>
          </div>
        </div>

        <!-- EDUCATION SECTION -->
        <div class="form-section">
          <h3>Education & Skills</h3>
          <div class="form-group">
            <label for="education">Education</label>
            <textarea id="education" placeholder="Education"></textarea>
          </div>
          <div class="form-group">
            <label for="tech">Technical Skills</label>
            <textarea id="tech" placeholder="Technical Skills"></textarea>
          </div>
          <div class="form-group">
            <label for="languages">Languages</label>
            <textarea id="languages" placeholder="Languages"></textarea>
          </div>
        </div>

        <!-- ADDITIONAL SECTION -->
        <div class="form-section">
          <h3>Additional Information</h3>
          <div class="form-group">
            <label for="projects">Projects</label>
            <textarea id="projects" placeholder="Projects"></textarea>
          </div>
          <div class="form-group">
            <label for="hobbies">Hobbies</label>
            <textarea id="hobbies" placeholder="Hobbies"></textarea>
          </div>
        </div>

        <!-- BUTTONS -->
        <div class="form-actions">
          <button class="btn btn-primary" onclick="saveResume()">Save Resume</button>
          <button class="btn btn-secondary" onclick="goToPreview()">Preview & Download</button>
        </div>
      </div>
    </div>

    <!-- RIGHT PANEL - PREVIEW -->
    <div class="preview-panel">
      <div class="preview-sticky">
        <h3>Preview</h3>
        <div id="resumePreview" class="resume-preview">
          <div class="preview-name" id="p-name">Your Name</div>
          <div class="preview-title" id="p-title">Professional Title</div>
          <div class="preview-contact">
            <span id="p-phone">Phone</span> | 
            <span id="p-email">Email</span> | 
            <span id="p-address">Address</span>
          </div>
          <hr />
          <div class="preview-section">
            <strong>Career Objective</strong>
            <p id="p-profile">Add your career objective</p>
          </div>
          <div class="preview-section">
            <strong>Experience</strong>
            <p id="p-experience">Add your work experience</p>
          </div>
          <div class="preview-section">
            <strong>Skills</strong>
            <ul id="p-skills"></ul>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
