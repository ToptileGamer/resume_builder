<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Resume Builder</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="form">
  <h2>Build Your Resume</h2>

  <input id="name" placeholder="Full Name">
  <input id="phone" placeholder="Phone">
  <input id="email" placeholder="Email">
  <input id="address" placeholder="Address">

  <input id="father" placeholder="Father Name">
  <input id="mother" placeholder="Mother Name">

  <textarea id="profile" placeholder="Career Objective"></textarea>
  <textarea id="education" placeholder="Education"></textarea>
  <textarea id="languages" placeholder="Languages"></textarea>
  <textarea id="hobbies" placeholder="Hobbies"></textarea>
  <textarea id="experience" placeholder="Work Experience"></textarea>
  <textarea id="skills" placeholder="Skills (comma separated)"></textarea>
  <textarea id="tech" placeholder="Technical Skills"></textarea>
  <textarea id="projects" placeholder="Projects"></textarea>

  <button onclick="goToResume()">Generate Resume</button>
</div>

<script>
// Autofill when coming back
window.onload = function () {
  const data = JSON.parse(localStorage.getItem("resumeData"));

  if (data) {
    for (let key in data) {
      if (document.getElementById(key)) {
        document.getElementById(key).value = data[key];
      }
    }
  }
};

function goToResume() {
  const fields = [
    "name","phone","email","address","father","mother",
    "profile","education","languages","hobbies",
    "experience","skills","tech","projects"
  ];

  let data = {};

  fields.forEach(id => {
    data[id] = document.getElementById(id).value;
  });

  localStorage.setItem("resumeData", JSON.stringify(data));
  window.location.href = "resume.html";
}
</script>

</body>
</html>
