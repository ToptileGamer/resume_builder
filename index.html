<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Resume Builder</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="form">
  <h2>Build Your Resume</h2>

  <input id="name" placeholder="Full Name" >
  <input id="title" placeholder="Job Title">
  <input id="phone" placeholder="Phone">
  <input id="email" placeholder="Email">
  <input id="address" placeholder="Address">

  <textarea id="profile" placeholder="Profile"></textarea>
  <textarea id="education" placeholder="Education"></textarea>
  <textarea id="skills" placeholder="Skills (comma separated)"></textarea>
  <textarea id="experience" placeholder="Experience"></textarea>

  <button onclick="goToResume()">Generate Resume</button>
</div>

<script>
// PREFILL DATA
window.onload = function () {
  const data = JSON.parse(localStorage.getItem("resumeData"));

  if (data) {
    document.getElementById("name").value = data.name || "";
    document.getElementById("title").value = data.title || "";
    document.getElementById("phone").value = data.phone || "";
    document.getElementById("email").value = data.email || "";
    document.getElementById("address").value = data.address || "";
    document.getElementById("profile").value = data.profile || "";
    document.getElementById("education").value = data.education || "";
    document.getElementById("skills").value = data.skills || "";
    document.getElementById("experience").value = data.experience || "";
  }
};

function goToResume() {
  const data = {
    name: document.getElementById("name").value,
    title: document.getElementById("title").value,
    phone: document.getElementById("phone").value,
    email: document.getElementById("email").value,
    address: document.getElementById("address").value,
    profile: document.getElementById("profile").value,
    education: document.getElementById("education").value,
    skills: document.getElementById("skills").value,
    experience: document.getElementById("experience").value,
  };

  localStorage.setItem("resumeData", JSON.stringify(data));
  window.location.href = "resume.html";
}
</script>

</body>
</html>
