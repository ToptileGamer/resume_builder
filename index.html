<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Resume Builder</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="auth-page">
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <h1>Resume Builder</h1>
        <p>Create your professional resume</p>
      </div>
      <div style="padding: 30px; text-align: center;">
        <p style="margin-bottom: 20px; color: #666;">Redirecting...</p>
        <div style="display: inline-block; width: 40px; height: 40px; border: 4px solid #667eea; border-top-color: transparent; border-radius: 50%; animation: spin 1s linear infinite;"></div>
      </div>
    </div>
  </div>

  <style>
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>

  <script>
    // Auto-redirect based on authentication status
    window.addEventListener('DOMContentLoaded', function() {
      const user = localStorage.getItem('currentUser');
      if (user) {
        // User is logged in, go to dashboard
        window.location.href = 'dashboard.html';
      } else {
        // User is not logged in, go to auth
        window.location.href = 'auth.html';
      }
    });
  </script>
</body>
</html>
