<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Resume Builder - Authentication</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="auth-page">
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <h1>Resume Builder</h1>
        <p>Create your professional resume</p>
      </div>

      <!-- LOGIN FORM -->
      <form id="loginForm" class="auth-form active">
        <h2>Login</h2>
        
        <div class="form-group">
          <label for="loginEmail">Email</label>
          <input 
            type="email" 
            id="loginEmail" 
            placeholder="Enter your email"
            required
          />
        </div>

        <div class="form-group">
          <label for="loginPassword">Password</label>
          <input 
            type="password" 
            id="loginPassword" 
            placeholder="Enter your password"
            required
          />
        </div>

        <button type="submit" class="btn btn-primary">Login</button>

        <div class="auth-message" id="loginMessage"></div>

        <p class="auth-toggle">
          Don't have an account? 
          <button type="button" class="link-btn" onclick="toggleForms()">Sign up</button>
        </p>
      </form>

      <!-- SIGNUP FORM -->
      <form id="signupForm" class="auth-form">
        <h2>Sign Up</h2>

        <div class="form-group">
          <label for="signupName">Full Name</label>
          <input 
            type="text" 
            id="signupName" 
            placeholder="Enter your full name"
            required
          />
        </div>

        <div class="form-group">
          <label for="signupEmail">Email</label>
          <input 
            type="email" 
            id="signupEmail" 
            placeholder="Enter your email"
            required
          />
        </div>

        <div class="form-group">
          <label for="signupPassword">Password</label>
          <input 
            type="password" 
            id="signupPassword" 
            placeholder="Enter a password (min 6 characters)"
            required
            minlength="6"
          />
        </div>

        <div class="form-group">
          <label for="signupConfirmPassword">Confirm Password</label>
          <input 
            type="password" 
            id="signupConfirmPassword" 
            placeholder="Confirm your password"
            required
            minlength="6"
          />
        </div>

        <button type="submit" class="btn btn-primary">Sign Up</button>

        <div class="auth-message" id="signupMessage"></div>

        <p class="auth-toggle">
          Already have an account? 
          <button type="button" class="link-btn" onclick="toggleForms()">Login</button>
        </p>
      </form>
    </div>
  </div>

  <script src="auth.js"></script>
</body>
</html>
